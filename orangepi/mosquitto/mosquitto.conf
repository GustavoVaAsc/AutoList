# Mosquitto de la Orange Pi (plan, secciones 6.3 y 7.1).
# El archivo de contraseñas lo genera entrypoint.sh al arrancar, a partir de
# las MQTT_*_PASSWORD de orangepi/.env; no existe ninguno en el repo. El archivo
# de ACL (acl, en esta carpeta) también se copia a /run/mosquitto al arrancar.

# Sin acceso anónimo: el listener exige usuario y contraseña.
allow_anonymous false
password_file /run/mosquitto/passwd

# Control de acceso por rol (docs/contrato-mqtt.md, sección 6).
acl_file /run/mosquitto/acl

# Mensajes de hasta 256 KiB (la miniatura del registro es lo más grande).
max_packet_size 262144

persistence true
persistence_location /mosquitto/data/

log_dest stdout
# "notice" registra cada conexión, incluidos los rechazos por mala contraseña
# ("not authorised"), que conviene poder revisar. El precio es el healthcheck
# del compose (cliente anónimo "healthcheck", cada 60 s), que a propósito es
# rechazado y deja unas líneas por minuto; la rotación de logs del compose acota
# el espacio que ocupan.
log_type error
log_type warning
log_type notice

# MQTT para la XIAO, Node-RED, visión y pantalla. El frontend no habla MQTT.
listener 1883

# Opción propia del listener, por eso va después de "listener". El client id es el
# nombre de usuario: un cliente no puede hacerse pasar por otro rol con otro id,
# pero dos clientes con el mismo usuario se expulsan entre sí (el segundo
# desconecta al primero).
use_username_as_clientid true
