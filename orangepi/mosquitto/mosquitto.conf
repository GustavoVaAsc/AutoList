# Mosquitto de la Orange Pi (plan, secciones 6.3 y 7.1).
# El archivo de contraseñas lo genera entrypoint.sh al arrancar, a partir de
# MQTT_USER y MQTT_PASSWORD de orangepi/.env; no existe ninguno en el repo.

# Sin acceso anónimo: todos los listeners exigen usuario y contraseña.
allow_anonymous false
password_file /run/mosquitto/passwd

# ACL (25 nov): crear orangepi/mosquitto/acl, montarlo en /mosquitto/config/acl
# en el compose y descomentar la línea siguiente.
# acl_file /mosquitto/config/acl

# Mensajes de hasta 256 KiB (la miniatura del registro es lo más grande).
max_packet_size 262144

persistence true
persistence_location /mosquitto/data/

log_dest stdout
# "notice" registra cada conexión, incluidos los rechazos por mala contraseña
# ("not authorised"), que conviene poder revisar. El precio es el healthcheck
# del compose (cliente "healthcheck", cada 60 s), que deja unas líneas por minuto;
# la rotación de logs del compose acota el espacio que ocupan.
log_type error
log_type warning
log_type notice

# MQTT para la XIAO, Node-RED, visión y pantalla.
listener 1883

# MQTT sobre WebSocket para el frontend (mqtt.js).
listener 9001
protocol websockets
