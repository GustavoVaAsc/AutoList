# Drop-in para systemd-time-wait-sync.service: espera acotada a la sincronizacion de hora.
#
# El aula no garantiza salida a internet (sin NTP). systemd-time-wait-sync trae por omision
# TimeoutStartSec=infinity: sin red, time-sync.target nunca se alcanzaria y el servicio de
# vision (ordenado After=time-sync.target) no arrancaria nunca. Con este limite, si a los
# 120 s no hubo sincronizacion, la espera falla y el target se alcanza igual (el servicio de
# vision lo pide con Wants=, no con Requires=), asi que la vision arranca. Lo que protege
# entonces la primera firma es la guardia del reloj del propio servicio (RTC o archivo de
# estado; orangepi/vision/README.md, "El reloj del borde").
#
# Instalacion (en la Orange Pi):
#   sudo install -D -m 0644 orangepi/systemd/systemd-time-wait-sync.service.d/limite-autolist.conf \
#       /etc/systemd/system/systemd-time-wait-sync.service.d/limite-autolist.conf
#   sudo systemctl daemon-reload
#   sudo systemctl enable systemd-time-wait-sync.service
[Service]
TimeoutStartSec=120
